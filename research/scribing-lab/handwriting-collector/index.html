<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>日本語単文字筆跡データ収集</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <!-- 設定 / 開始オーバーレイ -->
    <div id="setup" class="overlay">
      <form id="setupForm" class="setup-card">
        <h1>筆跡データ収集</h1>
        <p id="resumeNote" class="resume-note" hidden></p>

        <label>Writer ID
          <input id="writerId" name="writerId" type="text" value="self_001" required />
        </label>

        <label>文字セット
          <select id="charset" name="charset"></select>
        </label>

        <label>各文字の収録回数 (rounds)
          <input id="rounds" name="rounds" type="number" min="1" max="500" value="10" required />
        </label>

        <label>キャンバスサイズ (px)
          <input id="canvasSize" name="canvasSize" type="number" min="100" max="1600" step="20" value="200" required />
        </label>

        <label class="check">
          <input id="penOnly" name="penOnly" type="checkbox" checked />
          ペン入力のみ収録する (mouse/touch を無視)
        </label>

        <div class="setup-actions">
          <button id="resumeBtn" type="button" hidden>前回の続きから再開</button>
          <button type="submit">新規セッション開始</button>
        </div>
      </form>
    </div>

    <!-- 収録画面 -->
    <main id="recorder" hidden>
      <header class="topbar">
        <div class="meta">
          <span id="writerLabel"></span>
          <span id="progressLabel"></span>
          <span id="repLabel"></span>
        </div>
        <div class="prompt" id="promptChar"></div>
        <div id="warning" class="warning" hidden></div>
      </header>

      <section class="stage">
        <canvas id="canvas"></canvas>
      </section>

      <footer class="help">
        <span><kbd>Space</kbd>/<kbd>Enter</kbd> 確定して次へ</span>
        <span><kbd>Backspace</kbd>/<kbd>R</kbd> 書き直し</span>
        <span><kbd>Ctrl</kbd>+<kbd>Z</kbd> / <kbd>U</kbd> 直前のstroke取消</span>
        <span><kbd>S</kbd> JSONL保存</span>
        <span><kbd>Esc</kbd> メニュー</span>
        <span class="stats" id="stats"></span>
      </footer>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
