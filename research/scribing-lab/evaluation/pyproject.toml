[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scribing-evaluation"
version = "0.1.0"
description = "Run inspection tools for scribing lab"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
scribing-evaluate = "scribing_evaluation.cli:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.hatch.build.targets.wheel]
packages = ["scribing_evaluation"]
