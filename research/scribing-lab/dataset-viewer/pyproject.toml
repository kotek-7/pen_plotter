[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scribing-dataset-viewer"
version = "0.1.0"
description = "JSONL handwriting dataset preview tool for scribing lab"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
scribe-dataset-view = "scribing_dataset_viewer.cli:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.hatch.build.targets.wheel]
packages = ["scribing_dataset_viewer"]
