[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lstm-mdn-engine"
version = "0.1.0"
description = "char-conditioned LSTM-MDN handwriting engine (Graves 2013 applied to Japanese kana)"
requires-python = ">=3.11"
dependencies = [
    "torch",
    "numpy",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
hw-train = "lstm_mdn.train:main"
hw-sample = "lstm_mdn.sample:main"

[tool.hatch.build.targets.wheel]
packages = ["lstm_mdn"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

# CPU 版 torch を使う (Linux 既定の CUDA wheel は巨大なため明示的に CPU index を指定)。
[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
