[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scribing-runner"
version = "0.1.0"
description = "Minimal runner for scribing engines"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
scribe-run = "scribing_runner.cli:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.hatch.build.targets.wheel]
packages = ["scribing_runner"]
