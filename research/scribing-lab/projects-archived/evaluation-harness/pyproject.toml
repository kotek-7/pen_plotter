[project]
name = "scribing-lab"
version = "0.1.0"
description = "Research harness for handwriting synthesis experiments"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.7"]

[tool.pytest.ini_options]
pythonpath = ["."]
