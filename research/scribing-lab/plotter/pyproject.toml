[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scribing-plotter"
version = "0.1.0"
description = "Trajectory to xDraw A4 G-code for scribing lab"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
scribe-gcode = "scribing_plotter.cli:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.hatch.build.targets.wheel]
packages = ["scribing_plotter"]
