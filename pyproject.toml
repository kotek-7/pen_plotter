[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pen-plotter"
version = "0.1.0"
description = "Text to xDraw A4 G-code"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "matplotlib",
    "pyserial",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "hardware: 実機接続が必要なテスト",
]
